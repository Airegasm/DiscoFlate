<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DiscoFlate Stage</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
            font-family:system-ui,-apple-system,sans-serif;
            -webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  #frame{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000;
         container-type:size}
  #cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #cam.mir{transform:scaleX(-1)}
  #layers{position:absolute;inset:0;pointer-events:none;z-index:10}
  .ov{position:absolute;pointer-events:none}
  .wgauge{position:absolute;pointer-events:none;background:rgba(20,20,20,.75);
          border:2px solid #eee;border-radius:6px;overflow:hidden}
  .wgauge>i{display:block;background:#2ecc71;width:100%;height:100%}
  .wgauge>b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            color:#fff;font-size:min(3.2vh,16px);font-style:normal;text-shadow:0 1px 3px #000}
  .wtext{position:absolute;pointer-events:none;white-space:pre;font-weight:800;
         text-shadow:0 1px 3px #000,0 0 2px #000}
  .wtext.boxed{padding:.25em .6em;border-radius:10px;text-shadow:none}
  @keyframes dfflash{0%,49%{opacity:1}50%,100%{opacity:0}}
  .wpoll{position:absolute;pointer-events:none;box-sizing:border-box;overflow:hidden;
         border:2px solid var(--acc);border-left:6px solid var(--acc);border-radius:6px;
         padding:.5em .6em;color:#fff;font-size:min(2.6vh,15px);transition:opacity .5s}
  .wpoll .ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:.3em}
  .wpoll .pb{position:relative;height:1.6em;margin-top:.25em;background:#2e2e36;border-radius:3px}
  .wpoll .pb>i{display:block;height:100%;border-radius:3px}
  .wpoll .pb>b{position:absolute;left:6px;top:0;line-height:1.6em;font-weight:600}
  /* footer sits in the box's bottom padding, not after the last bar */
  .wpoll .pf{position:absolute;left:0;right:0;bottom:.3em;text-align:center;
             font-size:.78em;font-weight:600;opacity:.7}
  /* a Broadcast card has no rows — it IS the message */
  .wpoll .pbody{margin-top:.35em;white-space:pre-wrap;line-height:1.3;opacity:.92}
  /* notification slide: enters from its direction, leaves the same way */
  .anim{transition:transform var(--dur,.3s) ease-out, opacity var(--dur,.3s) ease-out}
  .anim.in{transform:translate(var(--dx,0),var(--dy,0));opacity:0}
  #brb{position:fixed;inset:0;background:#0a0d12;display:none;align-items:center;
       justify-content:center;color:#9fd6a5;font-size:10vw;font-weight:800;
       letter-spacing:.12em;z-index:40}
  #msg{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;
       text-align:center;color:#ff7a7a;font-size:14px;z-index:45;
       text-shadow:0 1px 3px #000;pointer-events:none}
  #lockhint{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;
       text-align:center;color:rgba(255,255,255,.45);font-size:13px;z-index:61;
       display:none;pointer-events:none}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;flex-wrap:wrap;
       justify-content:center;padding:14px 10px calc(14px + env(safe-area-inset-bottom));
       z-index:50;transition:opacity .25s}
  #bar.hide{opacity:0;pointer-events:none}
  #bar button{background:rgba(18,22,30,.85);color:#dfe7f3;
       border:1px solid rgba(255,255,255,.18);border-radius:12px;
       padding:12px 16px;font-size:16px;cursor:pointer}
  #shield{position:fixed;inset:0;z-index:60;display:none}
</style>
</head>
<body>
<div id="frame">
  <video id="cam" autoplay muted playsinline></video>
  <div id="layers"></div>
</div>
<div id="brb">⏸ BRB</div>
<div id="msg"></div>
<div id="lockhint">🔒 locked — hold anywhere for 1.5s to unlock</div>
<div id="bar">
  <button onclick="flipCam()">🔄 Camera</button>
  <button onclick="mirror()">🪞 Mirror</button>
  <button onclick="lockStage()">🔒 Lock</button>
  <button onclick="leave()">✕ Exit</button>
</div>
<div id="shield"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const AUTH = (document.querySelector('meta[name="df-auth"]')||{}).content || '';
const HDRS = {'Content-Type':'application/json','X-DiscoFlate-Auth':AUTH};

// ---- camera -----------------------------------------------------------
let facing='user', stream=null, wakeLock=null;
async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null;
  try{
    stream = await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:facing,width:{ideal:1920},height:{ideal:1920}}, audio:false});
    $('#cam').srcObject = stream; $('#msg').textContent='';
  }catch(e){ $('#msg').textContent = 'camera unavailable: '+(e.message||e); }
}
function flipCam(){ facing = facing==='user' ? 'environment' : 'user'; startCam(); showBar(); }
function mirror(){ $('#cam').classList.toggle('mir'); showBar(); }
function leave(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  if(window.Android && window.Android.keepAwake){ try{ Android.keepAwake(false); }catch(e){} }
  location.href = '/';
}

// ---- keep-awake: APK bridge when present, Wake Lock API otherwise ------
async function grabWake(){ try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
if(window.Android && window.Android.keepAwake){ try{ Android.keepAwake(true); }catch(e){} }
else grabWake();

// ---- BRB card + camera revive when we come back -------------------------
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ $('#brb').style.display='flex'; return; }
  $('#brb').style.display='none';
  const t = stream && stream.getVideoTracks()[0];
  if(!t || t.readyState!=='live') startCam();
  if(!(window.Android && window.Android.keepAwake)) grabWake();
});

// ---- touch lock: a shield eats every tap; hold 1.5s to unlock -----------
let unlockT=null;
function lockStage(){
  $('#shield').style.display='block'; $('#bar').classList.add('hide');
  flashHint();
}
function flashHint(){ const h=$('#lockhint'); h.style.display='block';
  setTimeout(()=>{ h.style.display='none'; }, 2200); }
$('#shield').addEventListener('pointerdown', ()=>{
  unlockT = setTimeout(()=>{ unlockT=null;
    $('#shield').style.display='none'; $('#lockhint').style.display='none'; showBar();
  }, 1500);
});
const cancelUnlock = ()=>{ if(unlockT){ clearTimeout(unlockT); unlockT=null; flashHint(); } };
$('#shield').addEventListener('pointerup', cancelUnlock);
$('#shield').addEventListener('pointercancel', cancelUnlock);

// ---- control bar auto-hides so it never shows on stream -----------------
let barT=null;
function showBar(){
  $('#bar').classList.remove('hide');
  if(barT) clearTimeout(barT);
  barT = setTimeout(()=>$('#bar').classList.add('hide'), 4000);
}
document.addEventListener('pointerdown', e=>{
  if(e.target.closest('#shield')) return;
  showBar();
});

// ---- linked Stage design (?stage=Name): frame aspect, always-on items ----
const STAGE_NAME = new URLSearchParams(location.search).get('stage') || '';
let designWidgets = [];
async function loadDesign(){
  if(!STAGE_NAME) return;
  try{
    const r = await fetch('/api/scene-design', {method:'POST', headers:HDRS,
      body: JSON.stringify({name: STAGE_NAME})});
    const j = await r.json();
    if(!j.ok || !j.stage) return;
    const W = +j.stage.width || 1280, H = +j.stage.height || 720;
    const fr = $('#frame');
    fr.style.width  = `min(100vw, calc(100vh * ${W/H}))`;
    fr.style.height = `min(100vh, calc(100vw * ${H/W}))`;
    (j.stage.overlays||[]).forEach(o=>{
      if(!o.visible) return;   // callable items arrive via the registry poll
      const el = itemEl(o);
      if(!el) return;
      $('#layers').appendChild(el);
      applyRadius(el, o);        // needs layout — only real once appended
      // an always-on item can still slide ON as the scene comes up; it has no
      // deadline, so there's nothing to time a slide-out against
      applySlide(el, slideSpec(o), null);
    });
    if(designWidgets.length){ widgetTick(); setInterval(widgetTick, 1000); }
  }catch(e){ /* design unavailable — plain camera stage */ }
}
// Build the DOM twin of a stage item — mirrors camera.py's sprite renderer
// so the phone Stage and the virtual cam look the same.
const FONTS = {sans:'system-ui,-apple-system,sans-serif', bold:'system-ui,sans-serif',
               serif:'Georgia,serif', mono:'ui-monospace,Menlo,monospace',
               script:'"Segoe Script","Brush Script MT",cursive'};
function styleText(el, o){
  el.style.textAlign = o.align || 'left';
  el.style.color = o.color || '#ffffff';
  el.style.fontFamily = FONTS[o.font||'sans'] || FONTS.sans;
  el.style.fontSize = Math.max(1, (o.size||0.06)*100) + 'cqh';
  if((o.bg||'').trim()){ el.classList.add('boxed'); el.style.background = o.bg; }
}
const ANIM_OFF = {up:['0','60px'], down:['0','-60px'], left:['60px','0'], right:['-60px','0']};
function applyAnim(el, o){
  if(!o.anim) return;
  const [dx,dy] = ANIM_OFF[o.anim_dir||'up'] || ANIM_OFF.up;
  el.style.setProperty('--dx', dx); el.style.setProperty('--dy', dy);
  el.style.setProperty('--dur', ((+o.fade_in||0.3))+'s');
  el.classList.add('anim','in');
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('in')));
}
// ---- slide in / slide out ------------------------------------------------
// The server normalises the six slide_* fields into {in,out} legs (stage.py's
// slide_spec) and hands them over on the overlay, so the page never has to
// know the field names. Distances are measured from where the layer actually
// sits, the same way camera.py does it, so the phone Stage and the virtual cam
// travel the same path.
const SL_EDGE = {l:'left', r:'right', u:'top', d:'bottom', up:'top', down:'bottom'};
// Design widgets are read straight from the scene config, so they arrive with
// the raw slide_* fields — this is stage.py's slide_spec, in JS.
function slideSpec(o){
  const leg = (on,d,s)=>{
    if(!on) return null;
    d = String(d||'').trim().toLowerCase(); d = SL_EDGE[d] || d;
    return {dir: ['left','right','top','bottom'].includes(d) ? d : 'left',
            secs: Math.max(0.05, +s || 0.4)};
  };
  o = o||{};
  return {in:  leg(o.slide_in,  o.slide_in_dir,  o.slide_in_secs),
          out: leg(o.slide_out, o.slide_out_dir, o.slide_out_secs)};
}
function slideOff(el, dir){
  const fr = $('#frame'), W = fr.clientWidth, H = fr.clientHeight;
  const x = el.offsetLeft, y = el.offsetTop;
  // a media layer may not have decoded yet — a whole frame always clears
  const w = el.offsetWidth || W, h = el.offsetHeight || H;
  if(dir === 'left')  return [-(x+w), 0];
  if(dir === 'right') return [W - x, 0];
  if(dir === 'top')   return [0, -(y+h)];
  return [0, H - y];                              // bottom
}
function slideTo(el, leg, dx, dy){
  el.style.transition = `transform ${Math.max(0.05, +leg.secs||0.4)}s ease-out`;
  el._sx = dx+'px'; el._sy = dy+'px'; setXform(el);
}
function slideIn(el, leg){
  if(!leg) return;
  const [dx,dy] = slideOff(el, leg.dir);
  el.style.transition = 'none';                   // park it off-frame first…
  el._sx = dx+'px'; el._sy = dy+'px'; setXform(el);
  void el.offsetWidth;                            // …commit that, then travel
  slideTo(el, leg, 0, 0);
}
function slideOut(el, leg){
  if(!leg) return;
  const [dx,dy] = slideOff(el, leg.dir);
  slideTo(el, leg, dx, dy);
}
// Put a parked layer back on its mark. Only self-gated widgets need this —
// a fired overlay leaves the DOM — but one that slides OUT and not in would
// otherwise stay off-frame for the rest of the session.
function slideHome(el){
  el.style.transition = 'none'; el._sx = el._sy = ''; setXform(el);
}
// Mount an overlay's slide legs. `left` is seconds until the registry drops
// it (stage.py ships that, not a deadline — clocks don't have to agree).
function applySlide(el, sl, left){
  sl = sl || {};
  if(sl.in) slideIn(el, sl.in);
  if(sl.out && left != null){
    const at = (+left - (+sl.out.secs||0.4)) * 1000;
    el._slideT = setTimeout(()=>slideOut(el, sl.out), Math.max(0, at));
  }
}
// Every transform on a layer is composed HERE, from two halves kept apart:
// `_base` is where the thing lives (place()'s anchor translate + rotation) and
// `_sx/_sy` is how far a slide has pushed it off that spot. Writing the whole
// string each time is what lets a slide animate — a CSS class can't, because
// the inline transform applyBox() sets would beat it.
function setXform(el){
  const slide = (el._sx || el._sy) ? `translate(${el._sx||'0px'},${el._sy||'0px'}) ` : '';
  el.style.transform = (slide + (el._base || '')).trim() || 'none';
}
function applyBox(el, o){
  if(o.opacity!=null){ const v=+o.opacity;
    el.style.opacity = String(Math.max(0, Math.min(1, v>100 ? v/255 : v/100))); }
  if(o.x != null && o.y != null){   // else keep whatever place() decided
    el.style.left = (o.x*100)+'%';
    el.style.top  = (o.y*100)+'%';
  }
  // keep any translate place() set for anchored items, then add rotation
  el._base = ((el._base || '') + (o.rot ? ` rotate(${o.rot}deg)` : '')).trim();
  setXform(el);
  el.style.transformOrigin = 'center center';
  if(o.flash) el.style.animation = `dfflash ${(+o.flash||1)*2}s steps(1,end) infinite`;
}
function itemEl(o){
  const kind = o.kind || 'media';
  if(kind !== 'media') o = Object.assign({}, o, {x: o.x ?? 0.05, y: o.y ?? 0.05});
  if(kind === 'media'){
    if(!o.media) return null;
    const el = mediaEl({kind: /\.(mp4|webm|mov|mkv|avi|m4v)$/i.test(o.media)?'video':'image',
                        media:o.media, mode:o.mode||'hold'}, null);
    place(el, {x:o.x, y:o.y, scale:o.w||0.3, pos:o.pos||'center', h:o.h});
    applyBox(el, o);
    return el;
  }
  if(kind === 'capacity_gauge'){
    const vert = String(o.orient||'h').toLowerCase().startsWith('v');
    const el = document.createElement('div');
    el.className = 'wgauge';
    el.innerHTML = '<i></i><b>0%</b>';
    el.style.width  = vert ? Math.max(1,(o.size||0.05)*100)+'cqh' : Math.max(4,(o.w||0.35)*100)+'%';
    el.style.height = vert ? Math.max(4,(o.w||0.35)*100)+'%'     : Math.max(1,(o.size||0.05)*100)+'cqh';
    if((o.bg||'').trim()) el.style.background = o.bg;
    const bar = el.querySelector('i');
    if(o.color) bar.style.background = o.color;
    if(vert){ bar.style.position='absolute'; bar.style.bottom='0'; bar.style.left='0'; bar.style.width='100%'; }
    applyBox(el, o);
    designWidgets.push({kind:'capacity_gauge', el, o, vert});
    return el;
  }
  if(CARD_KINDS[kind]){
    const el = document.createElement('div');
    el.className = 'wpoll';
    el.style.left=((o.x??0.05)*100)+'%'; el.style.top=((o.y??0.05)*100)+'%';
    el.style.width=((o.w||0.34)*100)+'%'; el.style.height=((o.h||0.3)*100)+'%';
    el.style.setProperty('--acc', o.color||'#f4a828');
    el.style.background = o.bg||'#12121a';
    el.style.display='none';                 // invisible until a poll runs
    applyBox(el, o);
    designWidgets.push({kind, el, o});
    return el;
  }
  // text + timers share the text renderer
  const el = document.createElement('div');
  el.className = 'wtext';
  styleText(el, o);
  el.textContent = kind==='pump_timer' ? (o.fmt_off||'PUMP idle')
                 : (kind==='device_timers'||kind==='timer') ? '' : (o.text||'');
  applyBox(el, o);
  if(kind==='pump_timer' || kind==='device_timers' || kind==='timer'
     || /\[[^\]]+\]/.test(o.text||''))
    designWidgets.push({kind, el, o});
  return el;
}
// ---- the card overlays -------------------------------------------------
// Poll / Competition / Bonus Round / Broadcast all draw the SAME embed card
// and all want the same corner, which is why the engine only lets one run at
// a time. Mirrors camera.py's _CARD_KINDS / _card_rows / _card_sprite.
const CARD_KINDS = {poll_viewer:'poll', competition_viewer:'competition',
                    bonus_round_viewer:'bonus_round', broadcast_viewer:'broadcast'};
function cardRows(v){
  if(v.rows) return v.rows.slice(0,8);
  const opts=(v.options||[]).slice(0,8), tot=Math.max(1, v.total||0), win=v.winner;
  return opts.map((o,i)=>({label:o.label||'', value:String(o.votes||0),
                           frac: v.total ? (o.votes||0)/tot : 0,
                           win: (win!=null && i===win)}));
}
function cardHtml(v, acc, left, footer){
  const rows=cardRows(v), anyWin=rows.some(r=>r.win);
  const body = rows.length
    ? rows.map(r=>`<div class="pb"><i style="width:${Math.round(100*Math.max(0,Math.min(1,+r.frac||0)))}%;`+
        `background:${(!anyWin||r.win)?acc:'#6e6e78'}"></i>`+
        `<b>${r.win?'🏆 ':''}${esc(r.label)}${r.value?' · '+esc(r.value):''}</b></div>`).join('')
    : (v.body ? `<div class="pbody">${esc(v.body)}</div>` : '');
  return `<div class="ph"><span>${esc(v.title||'')}</span>`+
         `<span style="color:${acc}">${Math.round(left)}s</span></div>`+
         body + (footer?`<div class="pf">${esc(footer)}</div>`:'');
}
// ---- device timer rows: scope, columns, plate --------------------------
// Mirrors camera.py's timer_rows / _fmt_cols / _rows_sprite so the phone
// Stage and the virtual cam produce the same table.
function timerRows(o, st, single){
  let rows = st.device_timers || [];
  if(!rows.length)
    rows = [{id:'', name:'PUMP', primary:true, firing:!!st.firing, remaining:+st.remaining||0}];
  if(single) return rows.slice(0,1);
  // `devices` scopes the list; empty/absent = every configured device, and
  // the reserved id 'primary' follows whichever device is primary
  const scope = (o.devices||[]).map(String).filter(Boolean);
  if(scope.length){
    const keep = rows.filter(r=>scope.includes(String(r.id||''))
                                || (scope.includes('primary') && r.primary));
    rows = keep.length ? keep : rows;       // scoped to devices that are gone
  }
  if(o.show_idle===false) rows = rows.filter(r=>r.firing);
  return rows;
}
function fmtCols(fmt, name, secs){
  const s = String(fmt);
  if(!s.includes('[name]')) return [s.replace('[secs]', secs), ''];
  const i = s.indexOf('[name]');
  return [s.slice(0,i)+name, s.slice(i+6).replace(/^\s+/,'').replace('[secs]', secs)];
}
// A two-column grid IS the tab stop: every countdown lines up at the same x
// however long the device names are, and the whole list shares one plate.
function drawRows(el, o, rows){
  el.style.display = 'inline-grid';
  el.style.gridTemplateColumns = 'auto auto';
  el.style.columnGap = '.55em';
  el.innerHTML = rows.map(r=>{
    const [a,b] = fmtCols(r.firing ? (o.fmt_on||'[name] [secs]s') : (o.fmt_off||'[name] idle'),
                          r.name||'device', Math.round(r.remaining||0));
    return `<span>${esc(a)}</span><span>${esc(b)}</span>`;
  }).join('');
  applyRadius(el, o);
}
// ---- rounded corners ---------------------------------------------------
// `radius` is a PERCENT of the box's shorter side (camera.py does the same),
// so a plate keeps its shape at any resolution and 50 is a full pill.
const RADIUS_DEF = {capacity_gauge:15, poll_viewer:3, solid:0};
function applyRadius(el, o){
  const kind = o.kind||'text';
  const painted = kind==='poll_viewer' || kind==='capacity_gauge' || kind==='solid'
                  || String(o.bg||'').trim();
  if(!painted){ el.style.borderRadius=''; return; }   // nothing to round
  let r = o.radius;
  if(r==null || r==='') r = (RADIUS_DEF[kind]!=null ? RADIUS_DEF[kind] : 12);
  r = Math.max(0, Math.min(50, +r||0));
  const side = Math.min(el.offsetWidth, el.offsetHeight);
  el.style.borderRadius = Math.round(side*r/100)+'px';
}
async function widgetTick(){
  try{
    const st = await (await fetch('/api/state', {headers:HDRS})).json();
    const pct = Math.max(0, +st.capacity||0), on = !!st.firing, rem = +st.remaining||0;
    designWidgets.forEach(w=>{
      if(w.kind==='capacity_gauge'){
        const f = Math.min(100, pct)+'%';
        const bar = w.el.querySelector('i');
        if(w.vert){ bar.style.height = f; bar.style.width='100%'; }
        else { bar.style.width = f; bar.style.height='100%'; }
        if(!w.o.color) bar.style.background =
          `hsl(${Math.round(120-1.2*Math.min(100,pct))} 70% 45%)`;   // green -> red
        w.el.querySelector('b').textContent = (w.o.show_pct===false) ? '' : pct.toFixed(0)+'%';
      } else if(CARD_KINDS[w.kind]){
        const pv = st[CARD_KINDS[w.kind]];
        const hold = +w.o.results_secs||8;
        // seconds until this card is done — only knowable once it is showing
        // RESULTS; while the round is live it has no end yet
        let ends = null, show = !!pv;
        if(pv && pv.phase==='results'){ ends = hold - (+pv.results_age||0); show = ends > 0; }
        // A card overlay is always mounted and gates itself, so its slide legs
        // ride the ROUND's clock rather than an overlay timer.
        const sl = w.sl || (w.sl = slideSpec(w.o));
        if(show && !w.on){ w.on = 1; w.el.style.display = ''; slideIn(w.el, sl.in); }
        if(!show){
          if(w.on){ w.on = 0; w.exit = 0; if(w.exitT) clearTimeout(w.exitT); slideHome(w.el); }
          w.el.style.display = 'none';
          return;
        }
        // arm the exit off a timer, not this 1s tick — a 0.4s leg would fall
        // straight through the gap between two samples
        if(sl.out && ends != null && !w.exit){
          w.exit = 1;
          w.exitT = setTimeout(()=>slideOut(w.el, sl.out),
                               Math.max(0, (ends - sl.out.secs)*1000));
        }
        const acc = w.o.color||'#f4a828';
        const left = pv.phase==='results' ? Math.max(0, ends) : (pv.remaining||0);
        // the poll's footer is its how-to-vote line, and only while voting is
        // open; every other card footers with whatever note the engine sent
        const foot = (w.kind==='poll_viewer')
          ? (pv.phase==='results' ? '' : 'Use the Chat Buttons to Vote')
          : (pv.note||'');
        w.el.innerHTML = cardHtml(pv, acc, left, foot);
      } else if(w.kind==='timer'){
        const live=(st.timers||{})[w.o.id];
        const sec = live!=null ? live : (+w.o.seconds||0);
        const m=Math.floor(sec/60), s=Math.round(sec%60);
        let t=String(w.o.text||'[secs]');
        if(!/\[(secs|mmss)\]/.test(t)) t+=' [secs]';
        w.el.textContent = t.replace('[secs]', Math.round(sec))
                            .replace('[mmss]', m+':'+String(s).padStart(2,'0'));
        applyRadius(w.el, w.o);   // the plate resizes as the digits do
        if(w.o.autovanish && live!=null && live<=0) w.el.style.display='none';
      } else if(w.kind==='device_timers' || w.kind==='pump_timer'){
        // one row per device, primary pump first — grows with the rig
        drawRows(w.el, w.o, timerRows(w.o, st, w.kind==='pump_timer'));
      } else {
        let t = String(w.o.text||'')
          .replace(/\[capacity\]/g, pct.toFixed(0)).replace(/\[secs\]/g, rem.toFixed(0))
          .replace(/\[timer\]/g, rem.toFixed(0));
        // [var:x] stays live too, so a countdown label keeps ticking
        t = t.replace(/\[var:([^\]]+)\]/g, (m,k)=> (st.vars&&st.vars[k]!=null)?st.vars[k]:m);
        w.el.textContent = t.replace(/\\n/g,'\n');
        applyRadius(w.el, w.o);   // a placeholder resolving changes the width
      }
    });
  }catch(e){}
}

// ---- overlay layers: poll the registry, reconcile the DOM ---------------
const live = {};   // overlay id -> element
function place(el, o){
  el.style.left = el.style.right = el.style.top = el.style.bottom = 'auto';
  el.style.width = Math.max(5, Math.min(100, (o.scale||0.5)*100)) + '%';
  if(o.h){ el.style.height = (o.h*100)+'%';
           el.querySelectorAll?.('img,video').forEach?.(m=>{m.style.height='100%';m.style.objectFit='fill';});
           el.style.objectFit = 'fill'; }
  if(o.x != null && o.y != null){   // stage-designed spot: exact fractions
    el.style.left = (o.x*100)+'%'; el.style.top = (o.y*100)+'%';
    el._base = ''; setXform(el);
    return;
  }
  const p = o.pos || 'center', M = '3%';
  if(p.includes('left')) el.style.left = M;
  else if(p.includes('right')) el.style.right = M;
  else el.style.left = '50%';
  if(p.includes('top')) el.style.top = M;
  else if(p.includes('bottom')) el.style.bottom = M;
  else el.style.top = '50%';
  const tx = (p.includes('left')||p.includes('right')) ? '0' : '-50%';
  const ty = (p.includes('top')||p.includes('bottom')) ? '0' : '-50%';
  el._base = `translate(${tx},${ty})`; setXform(el);
}
function mediaEl(o, onEnded){
  const url = '/images/' + encodeURIComponent(o.media);
  let el;
  if(o.kind === 'video'){
    el = document.createElement('video');
    el.autoplay = true; el.muted = true; el.playsInline = true;
    el.setAttribute('playsinline','');
    el.loop = o.mode !== 'once';
    if(o.mode === 'once' && onEnded) el.addEventListener('ended', onEnded);
    el.src = url;
  } else {
    el = document.createElement('img');
    el.src = url;
  }
  el.className = 'ov';
  return el;
}
async function pollOverlays(){
  try{
    const r = await fetch('/api/stage/active', {method:'POST', headers:HDRS, body:'{}'});
    if(!r.ok) throw new Error('http '+r.status);
    const j = await r.json();
    const want = {};
    (j.overlays||[]).forEach(o=>{
      want[o.id] = 1;
      if(live[o.id]) return;
      let el;
      if(o.kind === 'draw'){           // text / gauge / timer fired as a layer
        el = itemEl(o.item||{});
        if(!el) return;
      } else {
        el = mediaEl(o, ()=>{
          el.remove(); delete live[o.id];
          fetch('/api/stage/done', {method:'POST', headers:HDRS,
            body:JSON.stringify({id:o.id})}).catch(()=>{});
        });
        place(el, o);
        applyBox(el, {x:null, y:null, rot:o.rot, flash:o.flash});
      }
      if(o.z!=null || (o.item&&o.item.z!=null))
        el.style.zIndex = String(Math.round(+(o.z ?? o.item.z) || 0) + 10);
      $('#layers').appendChild(el);   // ties fall back to fire order
      applyRadius(el, (o.kind==='draw' ? (o.item||{}) : o));
      applyAnim(el, (o.kind==='draw' ? (o.item||{}) : o));
      applySlide(el, o.slide, o.left);   // after append: offsetLeft needs layout
      live[o.id] = el;
    });
    Object.keys(live).forEach(id=>{
      if(!want[id]){
        if(live[id]._slideT) clearTimeout(live[id]._slideT);
        live[id].remove(); delete live[id];
      }
    });
  }catch(e){ /* transient — keep the current scene */ }
}

startCam();
loadDesign();
pollOverlays();
setInterval(pollOverlays, 500);
showBar();
</script>
